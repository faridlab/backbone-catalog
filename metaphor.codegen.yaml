# Codegen policy for catalog.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Validated write path + guarded route composition (closes the CRUD-bypass hole).
  - "src/application/service/catalog_write_service.rs"
  - "src/presentation/http/guarded_routes.rs"
  # Repositories own the hand-written catalog SQL (item/variant lookups, validated inserts,
  # in-tx variant lifecycle, company-fenced EXISTS probes) orchestrated by catalog_write_service.
  # Declared here — not renamed with a `_custom` suffix — so the generator skips them wholesale;
  # this declaration is what makes editing them legitimate. Mirrors the backbone-banking pattern
  # (exchange_rate_repository.rs, fx_gain_loss_repository.rs).
  - "src/infrastructure/persistence/item_repository.rs"
  - "src/infrastructure/persistence/item_group_repository.rs"
  - "src/infrastructure/persistence/item_variant_repository.rs"
  - "src/infrastructure/persistence/uom_repository.rs"
  - "src/infrastructure/persistence/uom_conversion_repository.rs"
  - "src/infrastructure/persistence/attribute_repository.rs"
  - "src/infrastructure/persistence/attribute_value_repository.rs"
  - "src/infrastructure/persistence/brand_repository.rs"

  # Behavior tests (the golden cases / oracle) + route-level integrity probes + BDD features.
  - "tests/catalog_golden_cases.rs"
  - "tests/item_lookup.rs"
  - "tests/integrity_probes.rs"
  - "tests/features/**"

  # Hand-authored module documentation.
  - "docs/**"
