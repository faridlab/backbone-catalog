components:
  schemas:
    Attribute:
      type: object
      required:
        - id
        - company_id
        - code
        - name
        - attribute_type
        - status
        - metadata
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 100
        attribute_type:
          type: string
        status:
          type: string
        metadata:
          type: object

    AttributeBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateAttributeRequest:
      type: object
      required:
        - company_id
        - code
        - name
        - attribute_type
        - status
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 100
        attribute_type:
          type: string
        status:
          type: string
        metadata:
          type: object

    UpdateAttributeRequest:
      type: object
      required:
        - company_id
        - code
        - name
        - attribute_type
        - status
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 100
        attribute_type:
          type: string
        status:
          type: string
        metadata:
          type: object

    PatchAttributeRequest:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 100
        attribute_type:
          type: string
        status:
          type: string
        metadata:
          type: object

    AttributeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AttributeValue:
      type: object
      required:
        - id
        - company_id
        - attribute_id
        - code
        - label
        - sort_order
        - status
        - metadata
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        attribute_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
        label:
          type: string
          maxLength: 100
        label_en:
          nullable: true
          type: string
          maxLength: 100
        swatch_hex:
          nullable: true
          type: string
          maxLength: 10
        icon:
          nullable: true
          type: string
          maxLength: 255
        sort_order:
          type: integer
          format: int32
        status:
          type: string
        metadata:
          type: object

    AttributeValueBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

