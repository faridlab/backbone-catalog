# =============================================================================
# Catalog Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Canonical product/service identity for the ERP — Item, ItemGroup (category
# tree), Uom (unit of measure) + UomConversion. Consuming contexts hold their own
# projections (SellableProduct in selling, PurchasableItem in buying, StockItem in
# inventory) via logical FK to catalog.Item.id — this module owns identity + classification
# + units only, NOT stock levels, prices, or sales/purchase config.
# `schema: catalog` gives the module its own Postgres schema (see backbone-sapiens/bucket).
# =============================================================================

module: catalog
version: 2
schema: catalog
description: "Canonical product/service identity: Item, ItemGroup, Uom (Indonesia-first)"

# Tenancy: none, by design (ADR-0029). The module is tenant-agnostic and reusable —
# it ships no scoping column and no fence declaration. A composing backend-service
# that wants these tables org-scoped declares them in its tenancy.yaml; the
# decorator installs org_unit_id, the RLS policy, and the org-scoped per-unit
# indexes (the code/sku/barcode uniques and the listing indexes) at composition
# time.

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto
      # Dead scaffolding cut at the source (council YAGNI rec #4). Requires a metaphor-schema
      # generator that omits `pub mod <gen>;` when a generator is disabled, else the declaration
      # dangles (E0583) — fixed in metaphor-plugin-schema src/generators/module.rs.
      - specification        # 8 empty *_specification.rs — no entity defines predicates
      - events               # no-op publishers/handlers — nothing publishes; exports/events.rs is self-contained
    # catalog wires the optional per-entity layers (auth/bulk_operations/usecases) + the
    # routes/handlers composition in application/mod.rs + lib.rs — opt them in at the source.
    layers: true
    # RLS is never generator-emitted for this module: the historical company fence and its
    # successor artifacts are all hand-authored migrations (the tenant-scope chain and the
    # ADR-0029 strip). The ENABLE/FORCE flags they armed stay armed — the composing service's
    # tenancy decorator owns the policies now.
    rls_migration: false

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model.
imports:
  - item_group.model.yaml
  - uom.model.yaml
  - brand.model.yaml
  - item.model.yaml
  - uom_conversion.model.yaml
  - attribute.model.yaml
  - item_variant.model.yaml
