# =============================================================================
# Domain: Catalog
# Entity: Uom (Unit of Measure)
# Description: A unit in which items are counted/weighed/measured (satuan). E.g. PCS, KG, BOX,
# LITER. Units form parent-store reference trees (ADR-0023): each non-root unit points at a
# reference (parent) unit via relative_uom_id with a relative_factor ratio, and carries a
# recursive stored `factor` to its tree's root. Conversion between two units is application-side
# math over these stored factors and FAILS LOUDLY when the units live in different trees.
#
# Tenancy: none, by design (ADR-0029). The module is tenant-agnostic and reusable —
# it ships no scoping column and no fence declaration. A composing backend-service
# that wants these tables org-scoped declares them in its tenancy.yaml; the
# decorator installs org_unit_id, the RLS policy, and the org-scoped per-unit
# indexes (the code unique and the tree/listing indexes) at composition time.
# =============================================================================

models:
  - name: Uom
    collection: uoms
    description: "Unit of measure (satuan) for items; parent-store reference tree per ADR-0023"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique UOM identifier"

      code:
        type: string
        attributes: ["@required", "@max(20)"]
        description: "Short unique symbol (e.g. PCS, KG, BOX, L)"

      name:
        type: string
        attributes: ["@required", "@max(80)"]
        description: "Full name (e.g. Pieces, Kilogram)"

      uom_type:
        type: UomType
        attributes: ["@default(count)"]
        description: "Physical dimension this unit measures"

      decimal_places:
        type: int
        attributes: ["@default(0)", "@min(0)", "@max(6)"]
        description: "Allowed fractional precision (0 = whole units only)"

      # ADR-0023 parent-store tree. Units form reference trees via relative_uom_id
      # (NULL = tree root); the pre-v19 category shape is intentionally NOT ported.
      # relative_factor is the per-link ratio; factor is the recursive STORED effective
      # factor to the tree's root, re-derived on every tree write — callers never
      # hand-write it (hand-rolled factor updates are the lint target per ADR-0023).
      relative_uom_id:
        type: uuid?
        attributes: ["@foreign_key(Uom.id)"]
        description: "Reference (parent) unit this unit is defined against — NULL = tree root"

      relative_factor:
        type: decimal?
        attributes: ["@precision(24,12)", "@positive"]
        description: "Ratio to the parent unit: 1 of this unit = relative_factor of the parent unit (required iff relative_uom_id is set)"

      factor:
        type: decimal
        attributes: ["@precision(24,12)", "@positive", "@default(1)"]
        description: "Recursive stored effective factor to the tree root (1 of this unit = factor of the root unit; derived, 1 for a root)"

      # Protected units (UM-4): rows seeded as canonical reference data cannot be
      # deleted. Read-only in practice — protection is set by the seeding path, never
      # by API callers; a BEFORE DELETE trigger enforces it at the storage layer so no
      # write path (including raw SQL) can bypass it.
      is_protected:
        type: bool
        attributes: ["@default(false)"]
        description: "True for module-seeded reference units, which are blocked from deletion; user-created units are deletable"

      status:
        type: CatalogStatus
        attributes: ["@default(active)"]
        description: "Lifecycle status"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    relations:
      relative_uom:
        type: Uom?
        attributes: ["@one", "@foreign_key(relative_uom_id)"]
        description: "Reference (parent) unit"
        inverse: relative_children

      relative_children:
        type: Uom[]
        attributes: ["@one_to_many"]
        description: "Units defined directly against this unit"
        inverse: relative_uom

    indexes:
      # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
      # code unique and the tree/listing indexes are installed by the composing
      # service's tenancy decorator (org_unit_id-leading), not declared here.

# =============================================================================
# Enums
# =============================================================================

enums:
  - name: UomType
    description: "Physical dimension a unit measures"
    variants:
      - name: count
        description: "Countable units (pcs, box, dozen)"
        default: true
      - name: weight
        description: "Weight (kg, g, ton)"
      - name: volume
        description: "Volume (liter, ml, m3)"
      - name: length
        description: "Length (m, cm)"
      - name: area
        description: "Area (m2)"
      - name: time
        description: "Time (hour, day)"
      - name: other
        description: "Other"
